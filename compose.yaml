services:
  api:
    image: ${IMAGE_NAME:-flipkart-scraper:1.0.2}
    build:
      context: .
      args:
        APP_VERSION: "1.0.2"
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8081}:8000"
    environment:
      PORT: "8000"
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_TIMEOUT: ${PLAYWRIGHT_TIMEOUT:-30000}
      PLAYWRIGHT_MAX_CONCURRENT: ${PLAYWRIGHT_MAX_CONCURRENT:-3}
      BATCH_CONCURRENCY: ${BATCH_CONCURRENCY:-5}
      HTTPX_TIMEOUT: ${HTTPX_TIMEOUT:-30.0}
      HTTPX_CONNECT_TIMEOUT: ${HTTPX_CONNECT_TIMEOUT:-10.0}
      HTTPX_RETRIES: ${HTTPX_RETRIES:-2}
      HTTPX_FORCE_IPV4: ${HTTPX_FORCE_IPV4:-true}
      FLIPKART_PROXY: ${FLIPKART_PROXY:-${HTTPS_PROXY:-}}
    shm_size: "1gb"
    mem_limit: "2g"
    restart: unless-stopped
    stop_grace_period: 45s
